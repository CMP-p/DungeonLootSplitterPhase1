<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Emmanuelle">
    <title>Dungeon Loot Splitter</title>

    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
</head>
<!-- Page title: Dungeon Loot Splitter
Section: Party Setup, with Number of Party Members:
Section: Add Loot, with Loot Name:, Loot Value:, and the Add Loot button
Section: Loot List, with the items and running Total Loot
Section: Split Loot, with the Split Loot button, Total Loot, and Loot Per Party Member
Section: Logic Explanation, written in your own words -->
<body>
    <header>
        <h1>Dungeon Loot Splitter</h1>
    </header>

    <main>
        <section class="panel">
            <h2>  Party Setup</h2>
            <label for="partyMembers">Number of Party Members: </label>
            <input type="number" id="partyMembers" name="partyMembers">
        </section>

        <section class="panel">
            <h2>  Add Loot</h2>
            <fieldset>
                <label for="lootName">Loot Name: </label>
                <input type="text" id="lootName" name="AddLoot" >
                <label for="lootValue">Loot Value: </label>
                <input type="number" id="lootValue" name="lootValue">
                <input id="submitButton" type="button" value="Add Loot">
            </fieldset>
        </section>

        <section class="panel">
            <h2>  Loot List</h2>
            <ul id="itemsList" class="display">
                <li>Brown Shoe</li>
            </ul>
            <div class="totals">
                <p>Total Loot: </p>
                <p id="totalValue" class="display">0</p>
            </div>
        </section>

        <section class="panel">
            <h2>  Split Loot</h2>
            <input id="submitButton" type="button" value="Split Loot">
            <p>Total Loot: </p>
            <p id="partyTotalValue" class="display">0</p>
            <p>Loot Per Party Member</p>
            <p id="perMember" class="display">0</p>
        </section>

        <section class="reflection">
            <h2>    Logic Explanation</h2>
            <p id="Message">Using the functions, we do it up</p>
        </section>
    </main>
</body>
